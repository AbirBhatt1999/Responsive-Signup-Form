<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Form</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <form class="needs-validation" id="signupForm" novalidate>
    <div class="formbody">

      <div class="profile-photo">
        <img src="profile.png" alt="profilephoto">
      </div>

      <!-- Full Name -->
      <div class="form-group">
        <label class="User-input">Full Name</label>
        <input type="text" id="fullname" class="form-control" required>
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="User-input">Email</label>
        <input type="email" id="email" class="form-control" required>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label class="User-input">Phone Number</label>
        <input type="tel" id="phone" class="form-control" pattern="[0-9]{10}" required>
        <div class="invalid-feedback">Enter a valid 10-digit phone number.</div>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label class="User-input">User Name</label>
        <input type="text" id="username" class="form-control" required>
        <div class="invalid-feedback">Please enter a username.</div>
      </div>

      <!-- Password -->
      <div class="form-group password-container">
        <label class="User-input">Password</label>
        <input type="password" id="password" class="form-control" required>
        <i class="fa fa-eye password_eye" id="togglePassword"></i>
        <div class="invalid-feedback">Please enter a password.</div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group password-container">
        <label class="User-input">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" required>
        <i class="fa fa-eye password_eye" id="toggleConfirmPassword"></i>
        <div class="invalid-feedback">Passwords must match.</div>
      </div>

      <!-- Address -->
      <div class="form-group">
        <label class="User-input">Address</label>
        <textarea id="address" rows="6" placeholder="Enter your address" class="form-control" required></textarea>
        <div class="invalid-feedback">Please enter your address.</div>
      </div>

      <!-- Country -->
      <div class="form-group">
        <label class="User-input">Country</label>
        <select class="form-select" id="country" required>
          <option value="">Select your Country</option>
          <option>India</option>
          <option>Australia</option>
          <option>Arab</option>
        </select>
        <div class="invalid-feedback">Please select a country.</div>
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label class="User-input">Select Your Gender</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male" required> Male</label>
          <label><input type="radio" name="gender" value="Female" required> Female</label>
          <label><input type="radio" name="gender" value="Others" required> Others</label>
        </div>
      </div>

      <!-- Subjects -->
      <div class="form-group">
        <label class="User-input">Select Subjects</label>
        <div class="radio-group">
          <label><input type="checkbox" name="subject" value="Math"> Math</label>
          <label><input type="checkbox" name="subject" value="Chemistry"> Chemistry</label>
          <label><input type="checkbox" name="subject" value="Physics"> Physics</label>
        </div>
      </div>

      <!-- File Upload -->
      <div class="form-group">
        <label class="User-input">Upload Profile Picture</label>
        <input type="file" id="profilePic" class="form-control" required>
      </div>

      <div class="submit">
        <button class="submit_btn" type="submit">Submit</button>
      </div>

    </div>
  </form>

  <script src="script.js"></script>
</body>

</html>
