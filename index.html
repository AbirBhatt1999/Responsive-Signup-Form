<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Form</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"
    integrity="sha512-5A8nwdMOWrSz20fDsjczgUidUBR8liPYU+WymTZP1lmY9G6Oc7HlZv156XqnsgNUzTyMefFTcsFH/tnJE/+xBg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap');

    .formbody {
      width: 650px;
      margin: 50px auto;
      padding: 20px;
      background-color: rgb(222, 243, 174);
      box-shadow: 3px 2px 5px 2px #1c2306;
      border-radius: 10px;
    }

    img {
      height: 120px;
      padding: 20px;
    }

    .profile-photo {
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
      font-family: "Baloo 2", sans-serif;
    }

    .User-input {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .form-group select,
    .form-group input {
      padding: 12px 10px;
      background-color: #fff;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-family: "Baloo 2", sans-serif;
    }

    textarea {
      resize: none;
      padding: 12px 10px;
      background-color: rgb(239, 239, 239);
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .radio-group {
      display: flex;
      align-items: center;
    }

    .mrright15 {
      margin-right: 15px;
    }

    .submit {
      text-align: center;
    }

    .submit_btn {
      background-color: #4d86ef;
      color: white;
      border-radius: 5px;
      padding: 10px 20px;
      border: 0;
      font-size: 18px;
      font-weight: 600;
      font-family: "Baloo 2", sans-serif;
    }

    .password-container {
      position: relative;
    }

    .password_eye {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      cursor: pointer;
      color: gray;
    }
  </style>
</head>

<body>
  <form class="needs-validation" novalidate>
    <div class="formbody">
      <div class="profile-photo">
        <img src="profile.png" alt="profilephoto">
      </div>

      <div class="form-group">
        <label class="User-input">Full Name</label>
        <input type="text" class="form-control" required>
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>

      <div class="form-group">
        <label class="User-input">Email</label>
        <input type="email" class="form-control" required>
        <div class="invalid-feedback">Please enter your email.</div>
      </div>

      <div class="form-group">
        <label class="User-input">Phone Number</label>
        <input type="tel" class="form-control" required>
        <div class="invalid-feedback">Please enter your phone number.</div>
      </div>

      <div class="form-group">
        <label class="User-input">User Name</label>
        <input type="text" class="form-control" required>
        <div class="invalid-feedback">Please enter your user name.</div>
      </div>

      <div class="form-group password-container">
        <label class="User-input">Password</label>
        <input type="password" id="password" class="form-control" required>
        <i class="fa fa-eye password_eye" id="togglePassword"></i>
        <div class="invalid-feedback">Please enter your password.</div>
      </div>

      <div class="form-group password-container">
        <label class="User-input">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" required>
        <i class="fa fa-eye password_eye" id="toggleConfirmPassword"></i>
        <div class="invalid-feedback">Please enter your confirm password.</div>
      </div>

      <div class="form-group">
        <label class="User-input">Address</label>
        <textarea rows="6" placeholder="Please Enter Your Address" required></textarea>
        <div class="invalid-feedback">Please enter a message in the textarea.</div>
      </div>

      <div class="form-group">
        <label class="User-input">Country</label>
        <select class="form-select" required>
          <option value="">Select your Country</option>
          <option>India</option>
          <option>Australia</option>
          <option>Arab</option>
        </select>
        <div class="invalid-feedback">Please select a country.</div>
      </div>

      <div class="form-group">
        <label class="User-input">Select Your Gender</label>
        <div class="radio-group">
          <div class="mrright15">
            <label>Male</label>
            <input type="radio" name="gender" required>
          </div>
          <div class="mrright15">
            <label>Female</label>
            <input type="radio" name="gender" required>
          </div>
          <div class="mrright15">
            <label>Others</label>
            <input type="radio" name="gender" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="User-input">Select Subjects</label>
        <div class="radio-group">
          <div class="mrright15">
            <label>Math</label>
            <input type="checkbox" required>
          </div>
          <div class="mrright15">
            <label>Chemistry</label>
            <input type="checkbox" required>
          </div>
          <div class="mrright15">
            <label>Physics</label>
            <input type="checkbox" required>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="User-input">Upload Profile Picture</label>
        <input type="file" required>
      </div>

      <div class="submit">
        <button class="submit_btn">Submit</button>
      </div>
    </div>
  </form>

  <script>
    // Password Toggle Feature
    const togglePassword = document.querySelector('#togglePassword');
    const toggleConfirmPassword = document.querySelector('#toggleConfirmPassword');
    const password = document.querySelector('#password');
    const confirmPassword = document.querySelector('#confirmPassword');

    togglePassword.addEventListener('click', function () {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      this.classList.toggle('fa-eye-slash');
    });

    toggleConfirmPassword.addEventListener('click', function () {
      const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmPassword.setAttribute('type', type);
      this.classList.toggle('fa-eye-slash');
    });

    // Bootstrap Validation + Password Match
    (function () {
      'use strict'
      var forms = document.querySelectorAll('.needs-validation')
      Array.from(forms).forEach(function (form) {
        form.addEventListener('submit', function (event) {
          let password = form.querySelector('#password');
          let confirmPassword = form.querySelector('#confirmPassword');

          if (!form.checkValidity() || password.value !== confirmPassword.value) {
            event.preventDefault();
            event.stopPropagation();

            if (password.value !== confirmPassword.value) {
              confirmPassword.setCustomValidity("Passwords do not match");
              confirmPassword.classList.add('is-invalid');
            } else {
              confirmPassword.setCustomValidity("");
              confirmPassword.classList.remove('is-invalid');
            }
          } else {
            confirmPassword.setCustomValidity("");
          }
          form.classList.add('was-validated');
        }, false);
      });
    })()
  </script>
</body>

</html>
